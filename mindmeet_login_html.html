<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MindMeet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }
        
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 14px 32px;
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }
        
        .extra-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .extra-links a {
            color: #4f46e5;
            text-decoration: none;
        }
        
        .extra-links a:hover {
            text-decoration: underline;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        .alert-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">M</div>
            <h1>MindMeet</h1>
            <p class="subtitle">Inteligencia Artificial para Reuniones</p>
        </div>
        
        <!-- Formulario HTML que envía a LoginServlet usando método POST -->
        <form action="login" method="post" id="loginForm" onsubmit="return validarFormulario()">
            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="tu@email.com"
                    required
                    autocomplete="email"
                />
                <span class="error-message" id="emailError">Por favor ingrese un email válido</span>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                    minlength="6"
                    autocomplete="current-password"
                />
                <span class="error-message" id="passwordError">La contraseña debe tener al menos 6 caracteres</span>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="recordar" name="recordar" value="on">
                <label for="recordar">Recordarme en este dispositivo</label>
            </div>
            
            <button type="submit">Iniciar Sesión</button>
        </form>
        
        <div class="extra-links">
            <a href="registro.html">¿No tienes cuenta? Regístrate</a>
            <br>
            <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
    
    <script>
        // Validación del formulario HTML
        function validarFormulario() {
            let valido = true;
            
            // Limpiar errores previos
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            
            // Validar email
            const email = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim() || !emailRegex.test(email.value)) {
                document.getElementById('emailError').style.display = 'block';
                email.style.borderColor = '#dc2626';
                valido = false;
            } else {
                email.style.borderColor = '#e5e7eb';
            }
            
            // Validar password
            const password = document.getElementById('password');
            if (!password.value || password.value.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                password.style.borderColor = '#dc2626';
                valido = false;
            } else {
                password.style.borderColor = '#e5e7eb';
            }
            
            return valido;
        }
        
        // Verificar si hay parámetros en la URL (mensajes de error/éxito)
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const mensaje = urlParams.get('mensaje');
            
            if (error) {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-error';
                alertDiv.innerHTML = '<strong>Error:</strong> ' + decodeURIComponent(error);
                document.querySelector('form').insertAdjacentElement('beforebegin', alertDiv);
            }
            
            if (mensaje) {
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-success';
                alertDiv.textContent = decodeURIComponent(mensaje);
                document.querySelector('form').insertAdjacentElement('beforebegin', alertDiv);
            }
        });
    </script>
</body>
</html>
